name: Bootstrap AWS Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Import existing bootstrap resources
        shell: bash
        run: |
          set -e

          OIDC_PROVIDER_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn, 'token.actions.githubusercontent.com')].Arn | [0]" \
            --output text)

          if ! terraform state list | grep -q '^aws_iam_openid_connect_provider.github$'; then
            if [ -n "$OIDC_PROVIDER_ARN" ] && [ "$OIDC_PROVIDER_ARN" != "None" ]; then
              echo "Importing existing GitHub OIDC provider..."
              terraform import aws_iam_openid_connect_provider.github "$OIDC_PROVIDER_ARN"
            fi
          fi

          if ! terraform state list | grep -q '^aws_s3_bucket.terraform_state$'; then
            echo "Importing existing Terraform state bucket..."
            terraform import aws_s3_bucket.terraform_state "datadog-terraform-oac-867041163196"
          fi

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve